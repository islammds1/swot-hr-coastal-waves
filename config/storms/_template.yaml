# Copy to config/storms/<storm>.yaml. Files starting with "_" are skipped
# when a glob such as config/storms/*.yaml is passed to swothr.
# The compare step finds pipeline outputs as
#   Results/FFT/new/swot_5km_FFT_<stem>_FFT_v4.3.csv
#   Results/radon/new/swot_5km_RADON_<stem>_RADON_v4.3.csv
# so keep TAG = "<stem>_FFT_v4.3" / "<stem>_RADON_v4.3".
common:
  DATE: "YYYY-MM-DD"
  CYCLE: 0
  PASS: 0
  UTM_ZONE: 30

pipeline:
  SWOT_FILES:   "{root}/Data/SWOT HR/<stem>/SWOT_L2_HR_PIXC_*.nc"
  LR_FILES:     "{root}/Data/SWOT_LR/SWOT_L2_LR_SSH_Expert_<ccc>_<ppp>_*.nc"
  CURRENT_FILE: "{root}/Data/Surface current/Surface_current_<stem>.nc"
  WW3_FILE:     "{root}/Data/Wave Validation/MARC_WW3-NORGAS-2M_<stem>.nc"
  SWOT_QUAL_BITMASK: 0xF908F402
  # any other pipeline setting can go here, e.g.
  # CROSS_TRACK_MIN: 10000.0

fft:
  TAG: <stem>_FFT_v4.3

radon:
  TAG: <stem>_RADON_v4.3
