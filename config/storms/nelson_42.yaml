# Storm Nelson, cycle 13, pass 42 (2024-03-29).
# Keys are the UPPER-CASE settings of the scripts. {root} comes from paths.yaml.
common:
  DATE: "2024-03-29"
  CYCLE: 13
  PASS: 42
  UTM_ZONE: 30

pipeline:            # shared by fft and radon
  SWOT_FILES:   "{root}/Data/SWOT HR/Nelson_42/SWOT_L2_HR_PIXC_*.nc"
  LR_FILES:     "{root}/Data/SWOT_LR/SWOT_L2_LR_SSH_Expert_013_042_*.nc"
  CURRENT_FILE: "{root}/Data/Surface current/Surface_current_Nelson_42.nc"
  WW3_FILE:     "{root}/Data/Wave Validation/MARC_WW3-NORGAS-2M_Nelson_42.nc"
  # sc_event_suspect (0x4000) fires on ~100 % of Nelson pixels -> left out
  SWOT_QUAL_BITMASK: 0xF908B402

fft:
  TAG: Nelson_42_FFT_v4.3

radon:
  TAG: Nelson_42_RADON_v4.3

rain_flag:
  HR_FILES: "{root}/Data/SWOT HR/Nelson_42/SWOT_L2_HR_PIXC_*.nc"
  LR_FILE:  "{root}/Data/SWOT_LR/SWOT_L2_LR_SSH_Expert_013_042_*.nc"
  OUT_CSV:  "{root}/Outputs/rain_screen_Nelson_42.csv"
